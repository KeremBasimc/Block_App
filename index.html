<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description"
        content="Block Blaster! - Popular puzzle game. Place blocks, clear rows and columns, get the highest score!">
    <title>Block Blaster!</title>
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Block Blaster!">
    <link rel="manifest" href="/Block_App/manifest.json">
    <link rel="apple-touch-icon" href="/Block_App/icons/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ⚙ Settings Button — always visible -->
    <button id="settings-btn" aria-label="Settings">⚙</button>

    <!-- ═══════════════════════════════════════
         MAIN MENU
    ═══════════════════════════════════════ -->
    <div id="main-menu">
        <!-- Floating decorative blocks -->
        <div class="menu-float-blocks">
            <div class="fb fb-1"></div>
            <div class="fb fb-2"></div>
            <div class="fb fb-3"></div>
            <div class="fb fb-4"></div>
            <div class="fb fb-5"></div>
            <div class="fb fb-6"></div>
            <div class="fb fb-7"></div>
            <div class="fb fb-8"></div>
            <div class="fb fb-9"></div>
            <div class="fb fb-10"></div>
        </div>

        <div class="menu-inner">
            <!-- Logo -->
            <div class="menu-logo-wrap">
                <div class="menu-blocks-icon">
                    <div class="menu-block mb-1"></div>
                    <div class="menu-block mb-2"></div>
                    <div class="menu-block mb-3"></div>
                    <div class="menu-block mb-4"></div>
                </div>
                <h1 class="menu-title">Block <span>Blaster!</span></h1>
                <p class="menu-tagline">Place &nbsp;·&nbsp; Clear &nbsp;·&nbsp; Conquer</p>
            </div>

            <!-- Best Score -->
            <div class="menu-best-card">
                <div class="menu-best-label">BEST SCORE</div>
                <div class="menu-best-value" id="menu-best-score">0</div>
            </div>

            <!-- Play Button -->
            <button id="play-btn" class="play-btn">▶&nbsp;&nbsp;PLAY</button>
        </div>
    </div>

    <!-- ═══════════════════════════════════════
         SETTINGS PANEL
    ═══════════════════════════════════════ -->
    <div id="settings-panel" class="hidden">
        <div class="settings-backdrop" id="settings-backdrop"></div>
        <div class="settings-drawer" id="settings-drawer">
            <div class="settings-head">
                <h2>Settings</h2>
                <button id="settings-close" aria-label="Close settings">✕</button>
            </div>

            <p class="settings-section-label">🔊 Audio</p>
            <div class="setting-row">
                <div class="setting-text">
                    <span class="setting-name">Sound Effects</span>
                    <span class="setting-desc">Blocks, clears &amp; combos</span>
                </div>
                <label class="toggle-switch">
                    <input type="checkbox" id="toggle-sfx" checked>
                    <span class="toggle-slider"></span>
                </label>
            </div>

            <p class="settings-section-label">📱 Gameplay</p>
            <div class="setting-row">
                <div class="setting-text">
                    <span class="setting-name">Haptic Feedback</span>
                    <span class="setting-desc">Vibration on key moments</span>
                </div>
                <label class="toggle-switch">
                    <input type="checkbox" id="toggle-haptic" checked>
                    <span class="toggle-slider"></span>
                </label>
            </div>

            <p class="settings-section-label">🏠 Navigation</p>
            <button id="settings-menu-btn" class="settings-menu-btn">⌂&nbsp;&nbsp;Main Menu</button>

            <div class="settings-footer">
                <span class="settings-version">Block Blaster! v2.2</span>
            </div>
        </div>
    </div>

    <!-- ═══════════════════════════════════════
         GAME SCREEN
    ═══════════════════════════════════════ -->
    <div id="app" class="hidden">
        <!-- Header -->
        <header id="header">
            <div class="logo">
                <h1>Block <span class="highlight">Blaster!</span></h1>
            </div>
        </header>

        <!-- Score Panel -->
        <div id="score-panel">
            <div class="score-box current-score">
                <span class="score-label">SCORE</span>
                <span class="score-value" id="score">0</span>
            </div>
            <div class="score-box best-score">
                <span class="score-label">BEST</span>
                <span class="score-value" id="best-score">0</span>
            </div>
        </div>

        <!-- Combo Indicator -->
        <div id="combo-indicator" class="hidden">
            <span id="combo-text"></span>
        </div>

        <!-- Game Grid -->
        <div id="grid-container">
            <div id="grid"></div>
        </div>

        <!-- Piece Tray -->
        <div id="piece-tray">
            <div class="piece-slot" id="slot-0"></div>
            <div class="piece-slot" id="slot-1"></div>
            <div class="piece-slot" id="slot-2"></div>
        </div>

        <!-- AMAZING Overlay -->
        <div id="amazing-overlay" class="hidden">
            <div class="amazing-content">
                <div class="amazing-stars">⭐</div>
                <div class="amazing-text">AMAZING!</div>
                <div class="amazing-sub">+1500 BONUS</div>
            </div>
        </div>

        <!-- Game Over Overlay -->
        <div id="game-over-overlay" class="hidden">
            <div class="game-over-card">
                <h2>Game Over!</h2>
                <p class="final-score-label">YOUR SCORE</p>
                <p class="final-score" id="final-score">0</p>
                <p class="best-score-label">Best: <span id="final-best-score">0</span></p>
                <div class="game-over-buttons">
                    <button id="restart-btn">▶ Play Again</button>
                    <button id="menu-btn">⌂ Menu</button>
                </div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
    <script>
        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/Block_App/service-worker.js')
                    .then(reg => console.log('SW registered:', reg.scope))
                    .catch(err => console.log('SW registration failed:', err));
            });
        }
    </script>
</body>

</html>
